<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>25数控2班</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-top">
            <div class="school-name">25数控2班</div>
            <div class="header-actions">
                <a href="admin.html" class="admin-link">管理</a>
            </div>
        </div>
        <nav class="nav-tabs" id="navTabs">
            <span class="nav-item active" data-tab="home">首页</span>
            <span class="nav-item" data-tab="notice">公告</span>
            <span class="nav-item" data-tab="news">资讯</span>
            <span class="nav-item" data-tab="about">关于</span>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 轮播图 -->
        <section class="banner" id="banner">
            <div class="banner-slide active" style="background:#4A90D9;">
                <div class="banner-text">欢迎来到25数控2班官方门户网站</div>
            </div>
        </section>

        <!-- 公告栏 -->
        <section class="notice-bar" id="noticeBar">
            <span class="notice-label">📢 公告</span>
            <marquee class="notice-text" id="noticeText" scrollamount="4">
                暂无公告...
            </marquee>
        </section>

        <!-- 文章列表 -->
        <section class="article-list" id="articleList">
            <h2 class="section-title">最新动态</h2>
            <div id="articlesContainer">
                <div class="loading">暂无内容</div>
            </div>
        </section>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <p>© 2026 25数控2班 版权所有</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
