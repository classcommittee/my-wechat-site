<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>管理后台</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="dashboard">
        <!-- 侧栏 -->
        <aside class="sidebar">
            <div class="sidebar-brand">25数控2班</div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-page="articles">文章管理</a>
                <a href="#" data-page="notice">公告管理</a>
                <a href="#" data-page="settings">设置</a>
                <a href="#" id="logoutBtn">退出</a>
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="dashboard-main">
            <!-- 文章管理 -->
            <div id="pageArticles" class="page-content active">
                <div class="page-header">
                    <h2>文章管理</h2>
                    <button class="btn-primary" id="newArticleBtn">+ 写文章</button>
                </div>
                <div id="articleList" class="admin-list"></div>
            </div>

            <!-- 公告管理 -->
            <div id="pageNotice" class="page-content">
                <div class="page-header">
                    <h2>公告管理</h2>
                    <button class="btn-primary" id="newNoticeBtn">+ 发公告</button>
                </div>
                <div id="noticeList" class="admin-list"></div>
            </div>

            <!-- 设置 -->
            <div id="pageSettings" class="page-content">
                <h2>站点设置</h2>
                <form id="settingsForm">
                    <div class="form-group">
                        <label>站点名称</label>
                        <input type="text" id="siteName" value="25数控2班" />
                    </div>
                    <button type="submit" class="btn-primary">保存设置</button>
                </form>
            </div>
        </main>
    </div>

    <!-- 写文章/公告弹窗 -->
    <div class="modal" id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">写文章</h3>
                <span class="modal-close">&times;</span>
            </div>
            <form id="editorForm">
                <input type="hidden" id="editId" />
                <input type="hidden" id="editType" value="article" />
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="editTitle" placeholder="请输入标题" required />
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="editContent" rows="8" placeholder="请输入内容" required></textarea>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="editCategory">
                        <option value="news">资讯</option>
                        <option value="notice">公告</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">发布</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
